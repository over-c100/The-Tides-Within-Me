<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上线自检 · 我和我</title>
<style>
  :root{ --ok:#34d399; --bad:#f87171; --ink:#f4f1ea; --dim:#9c9aa6; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:38px 20px;background:
      radial-gradient(80% 60% at 20% 0%,#3b2a6b,transparent 60%),
      radial-gradient(70% 50% at 90% 20%,#1e3a5f,transparent 60%),#0a0a10;
      color:var(--ink);font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.06em}
  .sub{color:var(--dim);margin:0 0 26px;font-size:.9rem}
  .glass{background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
      backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
      border:1px solid rgba(255,255,255,.14);border-radius:20px;
      box-shadow:0 24px 60px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.16);}
  .card{padding:22px 24px;margin-bottom:18px}
  h2{font-size:1.05rem;margin:0 0 14px;letter-spacing:.08em;font-weight:500}
  .verdict{padding:20px 24px;margin-bottom:22px;font-size:1.02rem;border-radius:20px}
  .verdict.good{border-color:rgba(52,211,153,.5);background:linear-gradient(150deg,rgba(52,211,153,.16),rgba(52,211,153,.04))}
  .verdict.bad{border-color:rgba(248,113,113,.5);background:linear-gradient(150deg,rgba(248,113,113,.16),rgba(248,113,113,.04))}
  .verdict b{font-size:1.15rem}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.st{width:74px;font-weight:600;white-space:nowrap}
  .y{color:var(--ok)} .n{color:var(--bad)}
  code{font-family:ui-monospace,Consolas,monospace;font-size:.84em;
      background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;word-break:break-all}
  .path{color:var(--dim);font-size:.8rem}
  ol{margin:0;padding-left:22px} li{margin:9px 0}
  .scroll{max-height:340px;overflow:auto}
  .tag{display:inline-block;padding:2px 9px;border-radius:100px;font-size:.74rem;
      border:1px solid rgba(255,255,255,.2);margin-left:8px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <h1>上线自检</h1>
  <p class="sub">这个页面会逐个检查同目录下的资源文件是否存在，用来定位「黑底白字」的原因。</p>

  <div class="verdict glass" id="verdict">正在自检…</div>

  <div class="card glass">
    <h2>资源检查</h2>
    <div class="scroll"><table id="tbl"></table></div>
  </div>

  <div class="card glass">
    <h2>当前页面所在位置</h2>
    <table>
      <tr><td class="path" style="width:130px">本页地址</td><td><code id="here"></code></td></tr>
      <tr><td class="path">目录</td><td><code id="dir"></code></td></tr>
      <tr><td class="path">仓库根目录</td><td><code id="root"></code></td></tr>
      <tr><td class="path">index.html</td><td id="home"></td></tr>
      <tr><td class="path">assets/ 目录</td><td id="assetsDir"></td></tr>
    </table>
  </div>

  <div class="card glass" id="fix" hidden>
    <h2>怎么修</h2>
    <div id="fixBody"></div>
  </div>
</div>

<script>
var CHECK = [
  ['assets/style.css', '样式表（没有它 → 黑底白字）'],
  ['assets/app.js', '交互脚本'],
  ['assets/data.js', '跨页数据'],
  ['assets/placeholder.css', '图片占位样式'],
  ['assets/images/cover.jpg', '封面图'],
  ['assets/images/00-flyleaf.jpg', '扉页图'],
  ['assets/images/31-32.jpg', '末页图']
];

var here = location.href.split('?')[0];
var dir = here.replace(/[^/]*$/, '');

document.getElementById('here').textContent = here;
document.getElementById('dir').textContent = dir;

function probe(url) {
  return new Promise(function (res) {
    fetch(url, { method: 'GET', cache: 'no-store' })
      .then(function (r) {
        if (r.ok) { res({ ok: true, status: r.status }); }
        else if (r.status === 404) { res({ ok: false, status: 404 }); }
        else { res({ ok: true, status: r.status, note: '非 404，可能正常' }); }
      })
      .catch(function (e) { res({ ok: false, status: '网络错误', note: String(e.message || e) }); });
  });
}

var tbl = document.getElementById('tbl');
var rows = {};

Promise.all(CHECK.map(function (c) { return probe(c[0]); })).then(function (results) {
  var bad = 0;
  results.forEach(function (r, i) {
    var name = CHECK[i][0], desc = CHECK[i][1];
    var tr = document.createElement('tr');
    var st = r.ok ? '<span class="y">✓ 存在</span>' : '<span class="n">✗ 找不到</span>';
    if (!r.ok) bad++;
    tr.innerHTML = '<td class="st ' + (r.ok ? 'y' : 'n') + '">' + (r.ok ? '✓' : '✗') + '</td>' +
      '<td><code>' + name + '</code><div class="path">' + desc +
      (r.note ? ' · ' + r.note : '') + ' · HTTP ' + r.status + '</div></td>';
    tbl.appendChild(tr);
  });

  // 额外探测：仓库根目录
  var depth = (location.pathname.match(/\//g) || []).length;
  var isUserSite = /^[a-z0-9-]+\.github\.io$/i.test(location.hostname);
  var seg = location.pathname.split('/').filter(Boolean);
  var repoRoot = location.origin + '/' + (isUserSite ? (seg[0] || '') + '/' : (seg[0] || '') + '/');

  probe(repoRoot + 'assets/style.css').then(function (r) {
    document.getElementById('root').innerHTML = '<code>' + repoRoot + '</code>';
    document.getElementById('home').innerHTML = '—';
    document.getElementById('assetsDir').innerHTML = r.ok
      ? '<span class="y">根目录下有 assets/</span>'
      : '<span class="n">根目录下没有 assets/</span>';
    probe(repoRoot).then(function () {});
  });

  var v = document.getElementById('verdict');
  var sub = location.pathname.split('/').filter(Boolean);
  var looksNested = sub.length > (isUserSite ? 1 : 1);

  if (bad === 0 && !looksNested) {
    v.className = 'verdict glass good';
    v.innerHTML = '<b>✓ 资源都在，结构正确</b><br>这个页面能正常加载所有文件，说明上传没问题。' +
      '如果主页面仍然黑底白字，请按 <code>Ctrl+F5</code> 强制刷新（清除缓存），并确认访问的是 <code>index.html</code> 而不是别的文件。';
  } else {
    v.className = 'verdict glass bad';
    var msg = '<b>✗ 找到问题</b><br>';
    if (looksNested) {
      msg += '当前地址带了子目录 <code>' + sub.join('/') + '</code>，' +
        '如果你的页面是从仓库根目录发布的，那根目录里很可能只有一个文件夹、没有 index.html。<br>';
    }
    msg += '缺失文件：' + bad + ' / ' + CHECK.length + ' 个。';
    v.innerHTML = msg;

    var f = document.getElementById('fix');
    f.hidden = false;
    document.getElementById('fixBody').innerHTML =
      '<ol>' +
      '<li><b>打开你的仓库首页</b>，看看根目录里是 <code>index.html</code> 和 <code>assets</code> 文件夹，' +
        '还是只有一个 <code>我和我-绘本网页</code> 文件夹。' +
        '<span class="tag">后者就是病根</span></li>' +
      '<li>如果是<b>多套了一层文件夹</b>：把里面所有内容移到仓库根目录。' +
        '网页版操作：点进 <code>我和我-绘本网页</code>，勾选 <code>index.html</code> 和 <code>assets</code>，' +
        '把地址栏的 <code>/edit/main/我和我-绘本网页/</code> 改成 <code>/edit/main/</code>，回车，提交。</li>' +
      '<li>如果是 <b>assets 文件夹没传上去</b>（只看到 index.html）：' +
        '回到仓库根目录 → <b>Add file → Upload files</b> → 把本地的 <code>assets</code> 文件夹整个拖进去 → Commit。</li>' +
      '<li>传完等 1–2 分钟，回 Pages 页面 <code>Ctrl+F5</code> 强刷。</li>' +
      '</ol>' +
      '<p class="path">提示：本自检页放在哪个目录，就检查哪个目录 —— 把它放在 <code>index.html</code> 旁边才准。</p>';
  }
});
</script>
</body>
</html>
