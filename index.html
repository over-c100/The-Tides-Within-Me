<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<title>我和我 · The Tides Within Me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%234c1d95'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/ph.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 预加载：先把整本书的图下载完再开始，避免翻页时卡顿 -->
<div class="loading" id="loading" role="status" aria-label="加载中">
  <div class="loading__track"><i class="loading__fill" id="loadFill"></i></div>
</div>

<!-- 环境光：网格渐变，随书页取色变化 -->
<div class="amb" aria-hidden="true">
  <span class="amb__b amb__b--1"></span>
  <span class="amb__b amb__b--2"></span>
  <span class="amb__b amb__b--3"></span>
  <span class="amb__b amb__b--4"></span>
  <span class="amb__b amb__b--5"></span>
</div>
<div class="amb__grain" aria-hidden="true"></div>
<div class="amb__vignette" aria-hidden="true"></div>

<!-- 天气层：雨一直下 -->
<div class="weather" id="weather" aria-hidden="true"></div>

<main class="stage">
  <!-- 书 -->
  <div class="book" id="book" role="application" aria-label="绘本《我和我》">

    <!-- 页面堆叠的厚度 -->
    <span class="stack stack--r" aria-hidden="true"></span>

    <!-- 书页厚度：合上时从封面下方露出的白色内页 -->
    <span class="pageblock" id="pageblock" aria-hidden="true"></span>

    <!-- 书腰：合上时露出的书脊厚度（由布局合成，图里没有画） -->
    <span class="spine" id="spine" aria-hidden="true"></span>

    <!-- 摊开的两页 -->
    <div class="page page--l" id="pageL"><i class="page__img"></i></div>
    <div class="page page--r" id="pageR"><i class="page__img"></i></div>

    <!-- 书脊凹槽 + 内页阴影 -->
    <span class="gutter" aria-hidden="true"></span>
    <span class="shade shade--l" id="shadeL" aria-hidden="true"></span>
    <span class="shade shade--r" id="shadeR" aria-hidden="true"></span>

    <!-- 正在翻动的那一页：链式条带卷曲，由 JS 动态生成 -->
    <div class="leaf" id="leaf" hidden></div>

    <!-- 鼠标悬停时跟随的光斑 -->
    <span class="sheen" id="sheen" aria-hidden="true"></span>
  </div>

  <!-- 翻页控件 -->
  <button class="nav nav--prev" id="btnPrev" type="button" aria-label="上一页">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <button class="nav nav--next" id="btnNext" type="button" aria-label="下一页">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <div class="dots" id="dots" role="tablist" aria-label="书页"></div>
</main>

<!-- 竖屏提示：请把手机横过来（纯图形动画，无文字） -->
<div class="rotate" id="rotate" role="status" aria-label="请把手机横过来">
  <span class="rotate__ring" aria-hidden="true"></span>
  <span class="rotate__phone" aria-hidden="true"></span>
  <span class="rotate__tip">点击任意位置关闭</span>
</div>

<script src="assets/bookdata.js"></script>
<script src="assets/book.js"></script>
</body>
</html>
